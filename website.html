<!DOCTYPE html>
<html>
    <head>
        <title>Welcome to my website</title>
        <style>
            body {
                background-color: lightblue;
                font-family: Cambria;
                font-size: 14px;
                text-align: center;
                margin: 20px;
            }
            h1 {
                color: blue;
            }
            marquee{
                color: blue;
                font-weight: bold;
            }
            .btn{
                background-color: blue;
                color: white;
                padding: 10px 20px;
                border: none;
                cursor: pointer;
                margin: 20px;
            }
            .grid-container{
                display: grid;
                grid-template-columns: auto auto auto;
                gap: 15px;
                width: 60%;
                margin: auto;
            }
            .grid-item{
                background-color: white;
                border: 2px solid blue;
                padding: 20px;
                color: blue;
            }
        </style>
    </head>
    <body>
        <h1>welcome to my website</h1>
        <marquee behavior="scroll" direction="left">
            welcome to my website! Learn HTML and CSS
        </marquee>
        <p>This is a simple web page created using html and css</p>
        <button class="btn">Click here</button>
        <div class="grid-container">
            <div class="grid-item">Home</div>
            <div class="grid-item">About</div>
            <div class="grid-item">Contact</div>
            <div class="grid-item">Services</div>
            <div class="grid-item">Help</div>
        </div>

    </body>
</html>
