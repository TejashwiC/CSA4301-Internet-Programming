<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Cake Shop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:900px;
height:550px;
background:#fff;
border-radius:15px;
display:flex;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.left{
width:50%;
background:#ff4081;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
text-align:center;
}

.left h1{
font-size:38px;
margin-bottom:20px;
}

.left p{
font-size:18px;
line-height:28px;
}

.right{
width:50%;
padding:40px;
position:relative;
}

.form{
display:none;
}

.form.active{
display:block;
}

h2{
text-align:center;
color:#ff4081;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#ff4081;
color:#fff;
border:none;
font-size:17px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#e91e63;
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
text-decoration:none;
color:#ff4081;
cursor:pointer;
font-weight:bold;
display:block;
margin:8px;
}

@media(max-width:768px){

.container{
flex-direction:column;
height:auto;
width:95%;
}

.left,.right{
width:100%;
}

}
</style>

</head>

<body>

<div class="container">

<div class="left">
<h1>Sweet Cake Shop</h1>
<p>
Fresh Cakes for Every Celebration.
Order your favourite cake online with
fast delivery.
</p>
</div>

<div class="right">

<!-- LOGIN -->

<div id="login" class="form active">

<h2>Student Login</h2>

<input type="text" id="loginUser" placeholder="Username">

<input type="password" id="loginPass" placeholder="Password">

<button onclick="login()">Login</button>

<div class="links">

<a onclick="showRegister()">Create Account</a>

<a onclick="showForgot()">Forgot Password?</a>

</div>

</div>

<!-- REGISTER -->

<div id="register" class="form">

<h2>Student Registration</h2>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="text" placeholder="Phone Number">

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button onclick="register()">Register</button>

<div class="links">

<a onclick="showLogin()">Already have an account?</a>

</div>

</div>

<!-- FORGOT -->

<div id="forgot" class="form">

<h2>Forgot Password</h2>

<input type="email" placeholder="Enter Registered Email">

<button onclick="resetPassword()">Send Reset Link</button>

<div class="links">

<a onclick="showLogin()">Back to Login</a>

</div>

</div>

</div>

</div>

<script>

function showLogin(){

document.getElementById("login").classList.add("active");
document.getElementById("register").classList.remove("active");
document.getElementById("forgot").classList.remove("active");

}

function showRegister(){

document.getElementById("register").classList.add("active");
document.getElementById("login").classList.remove("active");
document.getElementById("forgot").classList.remove("active");

}

function showForgot(){

document.getElementById("forgot").classList.add("active");
document.getElementById("login").classList.remove("active");
document.getElementById("register").classList.remove("active");

}

function register(){

alert("Registration Successful!");

showLogin();

}

function resetPassword(){

alert("Password Reset Link Sent!");

showLogin();

}

function login(){

let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

if(user=="student" && pass=="1234"){

alert("Login Successful");

window.location.href="student.dashboard.html";

}

else{

alert("Username: student\nPassword: 1234");

}

}

</script>

</body>
</html>
