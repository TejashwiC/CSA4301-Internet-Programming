<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Sweet Cake Shop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff8f8;
}

header{
background:#ff4081;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
margin:30px auto;
}

.loginBox,.dashboard{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.dashboard{
display:none;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
background:#ff4081;
color:white;
border:none;
padding:12px;
cursor:pointer;
border-radius:6px;
font-size:16px;
width:100%;
margin-top:10px;
}

button:hover{
background:#d81b60;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:25px 0;
}

.card{
background:#ffeef3;
padding:20px;
text-align:center;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table,th,td{
border:1px solid #ccc;
}

th{
background:#ff4081;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
}

.logout{
background:red;
margin-top:20px;
}

h2{
color:#ff4081;
margin-top:20px;
margin-bottom:15px;
}
</style>
</head>

<body>

<header>🎂 Sweet Cake Shop - Admin Panel</header>

<div class="container">

<div class="loginBox" id="loginBox">

<h2>Admin Login</h2>

<input type="text" id="adminUser" placeholder="Username">

<input type="password" id="adminPass" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<div class="dashboard" id="dashboard">

<h2>Dashboard</h2>

<div class="cards">

<div class="card">
<h3>Total Cakes</h3>
<h1>12</h1>
</div>

<div class="card">
<h3>Total Orders</h3>
<h1>25</h1>
</div>

<div class="card">
<h3>Customers</h3>
<h1>18</h1>
</div>

<div class="card">
<h3>Revenue</h3>
<h1>₹18,500</h1>
</div>

</div>

<h2>Add Cake</h2>

<input type="text" placeholder="Cake Name">

<select>
<option>Birthday</option>
<option>Wedding</option>
<option>Anniversary</option>
<option>Party</option>
</select>

<input type="text" placeholder="Flavor">

<input type="number" placeholder="Price">

<textarea placeholder="Description"></textarea>

<button>Add Cake</button>

<h2>Manage Orders</h2>

<table>

<tr>
<th>Customer</th>
<th>Cake</th>
<th>Status</th>
</tr>

<tr>
<td>Tejashwi</td>
<td>Chocolate Cake</td>
<td>
<select>
<option>Pending</option>
<option>Confirmed</option>
<option>Preparing</option>
<option>Shipped</option>
<option>Delivered</option>
</select>
</td>
</tr>

<tr>
<td>Rahul</td>
<td>Red Velvet</td>
<td>
<select>
<option>Delivered</option>
<option>Pending</option>
<option>Confirmed</option>
<option>Preparing</option>
<option>Shipped</option>
</select>
</td>
</tr>

</table>

<h2>Customers</h2>

<table>

<tr>
<th>Name</th>
<th>Email</th>
</tr>

<tr>
<td>Tejashwi</td>
<td>tejashwi@gmail.com</td>
</tr>

<tr>
<td>Rahul</td>
<td>rahul@gmail.com</td>
</tr>

</table>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

</div>

<script>

function login(){

let user=document.getElementById("adminUser").value;
let pass=document.getElementById("adminPass").value;

if(user==="admin" && pass==="admin123"){

alert("Admin Login Successful");

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

}else{

alert("Username: admin\nPassword: admin123");

}

}

function logout(){

window.location.href="index.html";

}

</script>

</body>
</html>
